<div class="platform-shell">
  <header class="platform-topbar">
    <a class="brand" routerLink="/platform/tenants" aria-label="SMS Modular — panel platformy">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>
        <strong>SMS Modular</strong>
        <small>Panel platformy</small>
      </span>
    </a>
    <span class="platform-badge">Administrator platformy</span>
  </header>

  <div class="platform-body">
    <aside class="platform-nav" aria-label="Nawigacja platformy">
      <a routerLink="/platform/tenants" routerLinkActive="active">
        <span aria-hidden="true">♟</span>
        <span>Tenanci</span>
      </a>
      @if (canReadIntegration) {
        <a routerLink="/platform/integration-runtime" routerLinkActive="active">
          <span aria-hidden="true">!</span>
          <span>Integracje</span>
        </a>
      }
    </aside>
    <main class="platform-content">
      <router-outlet />
    </main>
  </div>
</div>
