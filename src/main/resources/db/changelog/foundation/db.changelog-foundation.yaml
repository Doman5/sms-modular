databaseChangeLog:
  - changeSet:
      id: foundation-001-migration-control
      author: sms-modular
      comment: Technical schema marker used to verify safe fresh and repeatable migrations.
      runAlways: true
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS foundation_control
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS foundation_control
