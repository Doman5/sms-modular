databaseChangeLog:
  - changeSet:
      id: tenancy-001-create-tenants
      author: sms-modular
      changes:
        - createTable:
            tableName: tenants
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tenants
                    nullable: false
              - column:
                  name: slug
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(160)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: time_zone
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: locale
                  type: varchar(35)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: closed_at
                  type: timestamp with time zone
        - addUniqueConstraint:
            tableName: tenants
            columnNames: slug
            constraintName: uq_tenants_slug
        - createIndex:
            tableName: tenants
            indexName: ix_tenants_status
            columns:
              - column:
                  name: status
