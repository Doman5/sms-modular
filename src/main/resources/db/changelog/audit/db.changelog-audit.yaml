databaseChangeLog:
  - changeSet:
      id: audit-001-table
      author: sms-modular
      changes:
        - createTable:
            tableName: audit_entries
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_entries
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
              - column:
                  name: actor_type
                  type: varchar(24)
                  constraints:
                    nullable: false
              - column:
                  name: actor_id
                  type: uuid
              - column:
                  name: module_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: action_code
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: jsonb
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: audit_entries
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_audit_entries_tenant
        - createIndex:
            tableName: audit_entries
            indexName: ix_audit_entries_tenant_time
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: occurred_at
              - column:
                  name: id
        - createIndex:
            tableName: audit_entries
            indexName: ix_audit_entries_actor_time
            columns:
              - column:
                  name: actor_id
              - column:
                  name: occurred_at
        - sql:
            sql: "ALTER TABLE audit_entries ADD CONSTRAINT chk_audit_entries_result CHECK (result IN ('SUCCESS', 'DENIED'))"
        - sql:
            sql: "ALTER TABLE audit_entries ADD CONSTRAINT chk_audit_entries_actor CHECK ((actor_type = 'SYSTEM' AND actor_id IS NULL) OR (actor_type IN ('TENANT_USER', 'PLATFORM_USER') AND actor_id IS NOT NULL))"
  - changeSet:
      id: audit-002-owner-permission
      author: sms-modular
      changes:
        - sql:
            sql: "INSERT INTO role_permissions (id, tenant_id, role_id, permission_code) SELECT gen_random_uuid(), tenant_id, id, 'AUDIT_READ' FROM tenant_roles WHERE code = 'OWNER' ON CONFLICT (tenant_id, role_id, permission_code) DO NOTHING"
