spring:
  application:
    name: sms-modular
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: UTC
  data:
    web:
      pageable:
        default-page-size: 25
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms_modular}
    username: ${SPRING_DATASOURCE_USERNAME:sms_modular_runtime}
    password: ${SPRING_DATASOURCE_PASSWORD:sms_modular_runtime_local}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${SPRING_LIQUIBASE_USER:sms_modular_owner}
    password: ${SPRING_LIQUIBASE_PASSWORD:sms_modular_owner_local}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:JdoYHPXNJn1/nAlnASdKZY5urdaSN9K1+i+/mc7tqQ4=}
    bootstrap-platform-email: ${BOOTSTRAP_PLATFORM_EMAIL:admin@admin.pl}
    bootstrap-platform-password: ${BOOTSTRAP_PLATFORM_PASSWORD:admin123admin123}
